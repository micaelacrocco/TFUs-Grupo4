services:
  postgres_db:
    image: postgres:16-alpine
    container_name: investnow_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - investnow-net

  redis:
    image: redis:7-alpine
    networks:
      - investnow-net

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-investnow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-investnow}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - investnow-net

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CATALOG_SERVICE_URL=http://catalog_service:8000
      - WALLET_SERVICE_URL=http://wallet_service:8000
      - ORDER_SERVICE_URL=http://order_service:8000
    depends_on:
      catalog_service:
        condition: service_healthy
      wallet_service:
        condition: service_healthy
      order_service:
        condition: service_healthy
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  wallet_service:
    build:
      context: .
      dockerfile: docker/wallet/Dockerfile
    #ports:
    #  - "8001:8000" --> Ya no es accesible desde afuera
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/config
    healthcheck:
      # Health Endpoint Monitoring (UT4): este chequeo es "profundo" -- el
      # propio GET /health de wallet_service valida la conexión a Postgres
      # (ver app/wallet_main.py), no solo que el proceso esté vivo.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  catalog_service:
    build:
      context: .
      dockerfile: docker/catalog/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    #ports:
    #  - "8002:8000" --> Ya no es accesible desde afuera
    depends_on:
      - redis
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  order_service:
    build:
      context: .
      dockerfile: docker/order/Dockerfile
    #ports:
    #  - "8003:8000" --> Ya no es accesible desde afuera
    environment:
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL}
      - WALLET_SERVICE_URL=${WALLET_SERVICE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://investnow:investnow@rabbitmq:5672/}
    depends_on:
      catalog_service:
        condition: service_healthy
      wallet_service:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/config
    healthcheck:
      # Chequeo "profundo" (GET /health/dependencies, UT4): valida que
      # order_service pueda alcanzar tanto a Catalog como a Wallet, sus
      # únicas dos dependencias (ver diagrama de componentes de UT3).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/dependencies', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  order_worker:
    build:
      context: .
      dockerfile: docker/order-worker/Dockerfile
    environment:
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL}
      - WALLET_SERVICE_URL=${WALLET_SERVICE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://investnow:investnow@rabbitmq:5672/}
    depends_on:
      catalog_service:
        condition: service_healthy
      wallet_service:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - investnow-net

volumes:
  pgdata:
  rabbitmqdata:

networks:
  investnow-net:
    name: investnow-net
    driver: bridge