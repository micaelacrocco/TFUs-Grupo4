services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order-db-demo}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet-db-demo}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit-db-demo}
    volumes:
      - pgdata_ut5:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - investnow-net

  redis:
    image: redis:7-alpine
    networks:
      - investnow-net

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-investnow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-investnow}
    volumes:
      - rabbitmqdata_ut5:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - investnow-net

  rabbitmq_init:
    build:
      context: .
      dockerfile: docker/order/Dockerfile
    command: ["python", "-m", "app.events.setup"]
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_DEFAULT_USER:-investnow}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-investnow}
      RABBITMQ_ADMIN_URL: amqp://${RABBITMQ_DEFAULT_USER:-investnow}:${RABBITMQ_DEFAULT_PASS:-investnow}@rabbitmq:5672/%2F
      RABBITMQ_ORDER_PASSWORD: ${RABBITMQ_ORDER_PASSWORD:-order-mq-demo}
      RABBITMQ_CATALOG_PASSWORD: ${RABBITMQ_CATALOG_PASSWORD:-catalog-mq-demo}
      RABBITMQ_WALLET_PASSWORD: ${RABBITMQ_WALLET_PASSWORD:-wallet-mq-demo}
      RABBITMQ_AUDIT_PASSWORD: ${RABBITMQ_AUDIT_PASSWORD:-audit-mq-demo}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - investnow-net

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CATALOG_SERVICE_URL: http://catalog_service:8000
      WALLET_SERVICE_URL: http://wallet_service:8000
      ORDER_SERVICE_URL: http://order_service:8000
    depends_on:
      order_service:
        condition: service_healthy
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  wallet_service:
    build:
      context: .
      dockerfile: docker/wallet/Dockerfile
    environment:
      DATABASE_URL: postgresql://wallet_app:${WALLET_DB_PASSWORD:-wallet-db-demo}@postgres_db:5432/wallet_db
      EVENTS_RABBITMQ_URL: amqp://wallet:${RABBITMQ_WALLET_PASSWORD:-wallet-mq-demo}@rabbitmq:5672/%2F
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq_init:
        condition: service_completed_successfully
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  catalog_service:
    build:
      context: .
      dockerfile: docker/catalog/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENTS_RABBITMQ_URL: amqp://catalog:${RABBITMQ_CATALOG_PASSWORD:-catalog-mq-demo}@rabbitmq:5672/%2F
    depends_on:
      redis:
        condition: service_started
      rabbitmq_init:
        condition: service_completed_successfully
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  order_service:
    build:
      context: .
      dockerfile: docker/order/Dockerfile
    environment:
      DATABASE_URL: postgresql://order_app:${ORDER_DB_PASSWORD:-order-db-demo}@postgres_db:5432/order_db
      EVENTS_RABBITMQ_URL: amqp://order:${RABBITMQ_ORDER_PASSWORD:-order-mq-demo}@rabbitmq:5672/%2F
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq_init:
        condition: service_completed_successfully
    networks:
      - investnow-net
    volumes:
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  audit_service:
    build:
      context: .
      dockerfile: docker/audit/Dockerfile
    environment:
      DATABASE_URL: postgresql://audit_app:${AUDIT_DB_PASSWORD:-audit-db-demo}@postgres_db:5432/audit_db
      EVENTS_RABBITMQ_URL: amqp://audit:${RABBITMQ_AUDIT_PASSWORD:-audit-mq-demo}@rabbitmq:5672/%2F
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq_init:
        condition: service_completed_successfully
    networks:
      - investnow-net

volumes:
  pgdata_ut5:
  rabbitmqdata_ut5:

networks:
  investnow-net:
    name: investnow-net
    driver: bridge
